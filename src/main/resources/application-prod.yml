spring:
  application:
    name: shiro-ai-agent
  profiles:
    active: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  ai:
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536                  # 维度
        max-document-batch-size: 10000
    mcp:
      client:
        stdio:
          servers-configuration: classpath:mcp-servers.json


server:
  port: 8123
  servlet:
    context-path: /api

# springdoc-openapi ??????
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.shiro.shiroaiagent.controller
# knife4j???????????????
knife4j:
  enable: true
  setting:
    language: zh_cn
# searchAPI
search-api:
  api-key: ${SEARCH_API_KEY}
# 修改日志级别，查看Spring AI 更多调用细节
logging:
  level:
    org.springframework.ai: DEBUG
